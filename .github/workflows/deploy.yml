name: Deploy to Ubuntu
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filmedin-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://filmedin.tanmaytiwari.me
    steps:
      - name: Deploy exact main revision
        env:
          DEPLOY_KEY: ${{ secrets.FILMEDIN_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.FILMEDIN_KNOWN_HOSTS }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/filmedin
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/filmedin ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/filmedin' EXIT
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -i ~/.ssh/filmedin ubuntu@15.206.247.203 "deploy $REVISION"
      - name: Verify public HTTPS endpoint
        run: curl --fail --silent --show-error --retry 3 --max-time 20 https://filmedin.tanmaytiwari.me/health
