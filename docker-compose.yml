services:
  mongodb:
    image: mongo:latest
    container_name: filmedin-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: filmedin-backend
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/filmedin
      JWT_SECRET: ${JWT_SECRET:-filmedin_super_secret_key_123}
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_TMDB_API_KEY: ${VITE_TMDB_API_KEY}
    container_name: filmedin-frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
  backend_uploads:
